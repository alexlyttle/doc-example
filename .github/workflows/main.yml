name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCMAKER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: matlab-actions/setup-matlab@v3
      - uses: matlab-actions/run-command@v3
        with:
          command: |
            fileName = websave("MATLAB_DocMaker.mtlbx","https://github.com/mathworks/docmaker/releases/latest/download/MATLAB_DocMaker.mltbx");
            matlab.addons.install(fileName,"overwrite",true);
      - uses: matlab-actions/run-build@v3
      - uses: actions/upload-artifact@v7
        with:
          name: toolbox
          path: "release/DocExample.mltbx"
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
        with:
          path: tbx/docs/

  deploy:
    # Add a dependency to the build job
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
